{% extends 'base.html' %}

{% block content %}
<h2>Admin Dashboard</h2>
<table class="table table-striped">
    <thead>
        <tr>
            <th>User</th>
            <th>Career Chosen</th>
        </tr>
    </thead>
    <tbody>
        {% for profile in users %}
            <tr>
                <td>{{ profile.user.username }}</td>
                <td>{{ profile.chosen_career.name if profile.chosen_career else "Not Taken Quiz" }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
