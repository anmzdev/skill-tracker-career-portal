{% extends 'user/user_dash.html' %}

{% block content %}
<div class="col-md-12 mx-auto" style="max-width: 1000px;">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h3 class="card-title text-primary font-weight-bold mb-4">🧠 Career Guidance Quiz</h3>
      <form method="post">
        {% csrf_token %}
        {% for question in questions %}
          <div class="mb-4">
            <strong class="h5 text-dark d-block mb-2">{{ forloop.counter }}. {{ question.text }}</strong>
            {% for option in question.option_set.all %}
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="q{{ question.id }}" value="{{ option.id }}" required>
                <label class="form-check-label font-weight-medium text-dark">{{ option.text }}</label>
              </div>
            {% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-success w-100 mt-3">Submit Quiz</button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
