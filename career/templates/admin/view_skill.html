{% extends 'admin/admin_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-primary text-center mb-4">Skills List</h3>
  <form method="get" class="mb-3 d-flex">
  <input type="text" name="q" placeholder="Search by skill..." class="form-control me-2" value="{{ query }}">
  <button type="submit" class="btn btn-lg btn-primary">Filter</button>
          <a href="{% url 'view_skill' %}" class="btn btn-lg btn-secondary">Reset</a>

</form>

  <table class="table table-bordered table-striped">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Skill Name</th>
        <th>Career</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for skill in skills %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ skill.name }}</td>
        <td>{{ skill.career.name }}</td>
        <td>
          <a href="{% url 'edit_skill' skill.id %}" class="btn btn-sm btn-outline-primary">Edit</a>
          <a href="{% url 'delete_skill' skill.id %}" class="btn btn-sm btn-outline-danger">Delete</a>
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="4" class="text-center">No skills available.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
