{% extends 'admin/admin_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-primary mb-4">Edit Skill</h3>

    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'view_skill' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
