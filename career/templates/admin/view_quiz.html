{% extends 'admin/admin_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-primary mb-4">All Quiz Questions</h3>
  <table class="table table-striped table-bordered">
    <thead class="table-light">
      <tr>
        <th>#</th>
        <th>Question</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
    {% for question in questions %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ question.text }}</td>
      <td>
        <a href="{% url 'edit_question' question.id %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'delete_question' question.id %}" class="btn btn-sm btn-danger"
           onclick="return confirm('Are you sure you want to delete this question?');">Delete</a>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
