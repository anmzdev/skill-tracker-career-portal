{% extends 'admin/admin_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-primary mb-4">All Users</h3>
<table class="table table-bordered table-hover text-center">
  <thead class="table-primary">
    <tr>
      <th>#</th>
      <th>Username</th>
      <th>User Type</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ forloop.counter }}</td>
      <td>{{ user.username }}</td>
      <td>
        {% if user.userprofile.is_recruiter %}
          <span class="badge bg-success">Recruiter</span>


        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>

</div>
{% endblock %}
