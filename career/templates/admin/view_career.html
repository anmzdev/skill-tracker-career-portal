{% extends 'admin/admin_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-primary mb-4">All Career Paths</h3>
  <form method="get" class="mb-3 d-flex">
  <input type="text" name="q" placeholder="Search by career..." class="form-control me-2" value="{{ query }}">
  <button type="submit" class="btn btn-lg btn-primary">Filter</button>
      <a href="{% url 'view_career' %}" class="btn btn-lg btn-secondary">Reset</a>

</form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>#</th>
        <th>Career Name</th>
        <th>Description</th>
      </tr>
    </thead>
    <tbody>
      {% for career in careers %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ career.name }}</td>
        <td>{{ career.description }}</td>
        <td>
          <a href="{% url 'edit_career' career.id %}" class="btn btn-sm btn-info">Edit</a>
          <a href="{% url 'delete_career' career.id %}" class="btn btn-sm btn-danger"
             onclick="return confirm('Are you sure you want to delete this career?');">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
