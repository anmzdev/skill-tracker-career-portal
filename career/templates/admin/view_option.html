{% extends 'admin/admin_dash.html' %}

{% block content %}
<div class="container mt-4">
  <div class="card p-4 shadow-sm">
    <h3 class="text-primary fw-bold mb-4">All Options</h3>

    <table class="table table-bordered">
      <thead>
        <tr>
          <th>#</th>
          <th>Question</th>
          <th>Option Text</th>
          <th>Career</th>
        </tr>
      </thead>
      <tbody>
        {% for option in options %}
        <tr>
          <td>{{ forloop.counter }}</td>
          <td>{{ option.question.text }}</td>
          <td>{{ option.text }}</td>
          <td>{{ option.career }}</td>
          <td>
  <a href="{% url 'edit_option' option.id %}" class="btn btn-sm btn-warning">Edit</a>
  <a href="{% url 'delete_option' option.id %}" class="btn btn-sm btn-danger"
     onclick="return confirm('Are you sure you want to delete this option?');">Delete</a>
</td>

        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
