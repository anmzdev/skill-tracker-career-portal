{% extends 'admin/admin_dash.html' %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow">
    <div class="card-body">
      <h4 class="text-center text-primary fw-bold mb-4">Edit Career</h4>

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label for="id_name" class="form-label fw-bold">Career Name</label>
          {{ form.name }}
        </div>

        <div class="mb-3">
          <label for="id_description" class="form-label fw-bold">Description</label>
          {{ form.description }}
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-success">Update Career</button>
          <a href="{% url 'view_career' %}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
