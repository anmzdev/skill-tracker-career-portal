{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow-sm p-4" style="width: 50%; max-width: 900px;">

    <div class="text-center mb-4">
      <h3 class="text-primary">Company Registration</h3>
      <p class="text-muted small">Register your company to post jobs and hire talent</p>

    </div>

    <form method="post" novalidate>
  {% csrf_token %}
      {{ user_form|crispy }}
  {{ profile_form|crispy }}

  <button type="submit" class="btn btn-primary w-100 mt-3">Register</button>
</form>


    <div class="mt-3 text-center small">
      Already registered?
      <a href="{% url 'login' %}">Login here</a>
    </div>

  </div>
</div>
{% endblock %}
