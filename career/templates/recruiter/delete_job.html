{% extends 'recruiter/recruiter_dash.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="text-center text-danger mb-4">Delete Job</h3>
  <p>Are you sure you want to delete the job: <strong>{{ job.title }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'view_jobs' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
