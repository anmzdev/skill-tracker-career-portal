{% extends 'recruiter/recruiter_dash.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mt-4">
  <h3 class="mb-4 text-primary">Edit Job Post</h3>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{% url 'view_jobs' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
