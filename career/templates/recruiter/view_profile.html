{% extends 'recruiter/recruiter_dash.html' %}
{% block content %}
<div class="container mt-5">
    <h3 class="text-center text-primary fw-bold mb-4">
      <i class="bi bi-building me-2"></i>Recruiter Profile
    </h3>

    <div class="row justify-content-center">
      <div class="col-md-8">
        <ul class="list-group list-group-flush fs-6">
           <li class="list-group-item d-flex justify-content-between">
            <span class="fw-semibold text-secondary">Name:</span>
            <span>{{ recruiter.name }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span class="fw-semibold text-secondary">Company Name:</span>
            <span>{{ recruiter.company_name }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span class="fw-semibold text-secondary">Email:</span>
            <span>{{ recruiter.contact_email }}</span>
          </li>
          <li class="list-group-item d-flex justify-content-between">
            <span class="fw-semibold text-secondary">Phone:</span>
            <span>{{ recruiter.phone }}</span>
          </li>
        </ul>

        <div class="text-center mt-4">
          <a href="{% url 'edit_profile' %}" class="btn btn-success px-4">
            <i class="bi bi-pencil-square me-1"></i> Edit Profile
          </a>
        </div>
      </div>
    </div>

</div>
{% endblock %}
